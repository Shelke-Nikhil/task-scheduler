services:

  frontend:
    build: ./frontend
    container_name: schedule-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: schedule-backend
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: schedule_tracker
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - database

  database:
    build: ./database
    container_name: schedule-database
    environment:
      POSTGRES_DB: schedule_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: